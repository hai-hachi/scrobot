collection_session_evaluator:
  ros__parameters:
    use_sim_time: true

    map_frame: map
    base_frame: base_footprint

    ground_truth_topic: /evaluation/ground_truth_odom
    shuttle_ground_truth_topic: /evaluation/shuttle_ground_truth
    shuttle_collected_topic: /evaluation/shuttle_collected

    mission_state_topic: /mission/state
    local_collect_phase_topic: /mission/local_collect_phase

    # Must match the final collection filter geometry.
    pole_x: 0.0
    pole_y_positions: [3.05, -3.05]
    pole_exclusion_radius: 0.60

    sample_rate: 20.0
    path_publish_rate: 1.0
    tf_timeout: 0.02

    # After an OVERRUN completes, allow the Gazebo removal request and bridge
    # to propagate before declaring a physical pickup verification failure.
    capture_verification_delay: 0.75

    output_root: ~/scrobot_ws/evaluation_results/collection_session
    run_name: ""
