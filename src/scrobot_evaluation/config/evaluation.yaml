evaluation_logger:
  ros__parameters:
    # Estimated robot pose comes from this TF pair.
    map_frame: map
    base_frame: base_footprint

    # Gazebo world pose bridged from dynamic_pose/info.
    ground_truth_topic: /evaluation/ground_truth_tf
    ground_truth_child_contains: scrobot

    # Latest Nav2 global plan used for cross-track error.
    global_plan_topic: /plan
    mission_state_topic: /mission/state

    # Published once whenever the global localizer commits map -> odom.
    relocalization_event_topic: /global_localization/tag_pose_committed

    # Keep zero when Gazebo world coordinates and court/map coordinates match.
    ground_truth_x_offset: 0.0
    ground_truth_y_offset: 0.0
    ground_truth_yaw_offset: 0.0

    # Logging rate and TF lookup timeout.
    sample_rate: 20.0
    tf_timeout: 0.05

    # Each launch creates a timestamped subdirectory if run_name is empty.
    output_root: ~/scrobot_evaluation_runs
    run_name: ""
