autonomy_mux:
  ros__parameters:
    use_stamped: true

    # Autonomous command sources only.
    topics:
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10

      final_approach:
        topic: /cmd_vel_approach
        timeout: 0.25
        priority: 50

      relocalization:
        topic: /cmd_vel_relocalization
        timeout: 0.5
        priority: 60


# Production AUTO/MANUAL arbitration.
#
# manual_mode_manager owns /cmd_vel_manual. While MANUAL is active it
# continuously publishes either the latest operator command or zero, so AUTO
# commands cannot leak through between key presses. Both AUTO and MANUAL then
# pass through the same smoother and collision monitor.
control_mode_mux:
  ros__parameters:
    use_stamped: true

    topics:
      autonomous:
        topic: /cmd_vel_auto
        timeout: 0.5
        priority: 10

      manual:
        topic: /cmd_vel_manual
        timeout: 0.25
        priority: 100


velocity_smoother:
  ros__parameters:
    smoothing_frequency: 25.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true

    # 0.8 m/s sweep speed; angular headroom also covers local SMC.
    max_velocity: [1.0, 0.0, 2.0]
    min_velocity: [-1.0, 0.0, -2.0]

    max_accel: [1.00, 0.0, 1.00]
    max_decel: [-1.40, 0.0, -1.80]

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.4


collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    transform_tolerance: 0.2
    base_shift_correction: true

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel
    enable_stamped_cmd_vel: true

    state_topic: /collision_monitor_state
    source_timeout: 0.3
    stop_pub_timeout: 2.0

    polygons:
      - stop_zone
      - slowdown_zone

    # Frontal protection begins at the real robot front edge x = 0.325 m.
    # Keep the zone compact so intentional low-speed shuttle collection is not
    # unnecessarily blocked; Nav2/costmaps provide the larger avoidance field.
    stop_zone:
      type: polygon
      action_type: stop
      min_points: 5
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
      points: "[[0.40, 0.225], [0.40, -0.225], [0.325, -0.225], [0.325, 0.225]]"

    slowdown_zone:
      type: polygon
      action_type: slowdown
      min_points: 5
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
      points: "[[0.50, 0.325], [0.50, -0.325], [0.325, -0.325], [0.325, 0.325]]"

    observation_sources:
      - depth_scan

    depth_scan:
      type: scan
      topic: /camera/camera/depth/scan
      source_timeout: 0.3
      enabled: true
