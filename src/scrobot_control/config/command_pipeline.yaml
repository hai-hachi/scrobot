twist_mux:
  ros__parameters:
    use_stamped: true

    # Autonomous command sources only.
    topics:
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10

      final_approach:
        topic: /cmd_vel_approach
        timeout: 0.25
        priority: 50

      relocalization:
        topic: /cmd_vel_relocalization
        timeout: 0.5
        priority: 60


# Production AUTO/MANUAL arbitration.
#
# manual_mode_manager owns /cmd_vel_manual. While MANUAL is active it
# continuously publishes either the latest operator command or zero, so AUTO
# commands cannot leak through between key presses. Both AUTO and MANUAL then
# pass through the same smoother and collision monitor.
control_mode_mux:
  ros__parameters:
    use_stamped: true

    topics:
      autonomous:
        topic: /cmd_vel_auto
        timeout: 0.5
        priority: 10

      manual:
        topic: /cmd_vel_manual
        timeout: 0.25
        priority: 100


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    # Nav2 controller and tag controller run at 25 Hz (40 ms per update).
    # ros2_control runs at 100 Hz; keep this timing fixed during the first
    # motor/RPM calibration so frequency changes do not confound the results.
    # Raise to 50 Hz later only if motor telemetry shows staircase artifacts.
    smoothing_frequency: 25.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true

    # Each wheel is limited to 0.50 m/s (0.05 m radius ~= 95.5 RPM).
    # Straight-only body limit: 0.50 m/s. Spin-only limit: 2*0.50/0.42
    # = 2.38 rad/s; use 2.30 for modest headroom.
    # CRITICAL: independent X and yaw caps do NOT constrain mixed commands:
    # |linear.x| + 0.21 * |angular.z| <= 0.50 must be enforced together by
    # the proposed source-ownership/wheel-envelope router. Existing hardware
    # also rescales wheel RPM together if either exceeds max_wheel_rpm.
    max_velocity: [0.50, 0.0, 2.30]
    min_velocity: [-0.50, 0.0, -2.30]

    # Provisional until MATLAB closed-loop wheel responses are analyzed.
    # A 0 -> 0.50 m/s ramp at 1 m/s^2 takes 0.50 s; a nominal
    # 0.50 -> 0 ramp at 1.4 m/s^2 takes 0.36 s, excluding PID lag.
    max_accel: [1.00, 0.0, 1.00]
    max_decel: [-1.40, 0.0, -1.80]

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 0.4
    odom_topic: /diff_drive_controller/odom
    odom_duration: 0.1


collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom
    transform_tolerance: 0.2
    base_shift_correction: true

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel
    enable_stamped_cmd_vel: true

    state_topic: /collision_monitor_state
    # Gazebo depth clouds arrive through bridge -> pointcloud_to_laserscan ->
    # scan self-filter. Allow normal simulator jitter without failing closed.
    source_timeout: 0.6
    stop_pub_timeout: 2.0

    # Simple fixed frontal zones. The old forward/backward/stopped
    # velocity sub-polygons are removed.
    polygons:
      - stop_zone
      - slowdown_zone

    # Requested stop strip: x = 0.30 .. 0.40 m from base_footprint.
    # Keep the existing +/-0.30 m lateral span.
    stop_zone:
      type: polygon
      action_type: stop
      min_points: 5
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
      points: "[[0.40, 0.225], [0.40, -0.225], [0.30, -0.225], [0.30, 0.225]]"

    # 10 cm margin around the stop zone.
    slowdown_zone:
      type: polygon
      action_type: slowdown
      min_points: 5
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
      points: "[[0.50, 0.325], [0.50, -0.325], [0.30, -0.325], [0.30, 0.325]]"

    observation_sources:
      - depth_scan

    depth_scan:
      type: scan
      topic: /camera/camera/depth/scan
      source_timeout: 0.6
      enabled: true
