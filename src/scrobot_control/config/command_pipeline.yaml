twist_mux:
  ros__parameters:
    use_stamped: true

    # Autonomous command sources only. Manual teleop is intentionally kept
    # out of this mux so it can bypass collision_monitor for emergency/backout.
    topics:
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10

      final_approach:
        topic: /cmd_vel_approach
        timeout: 0.25
        priority: 50

      relocalization:
        topic: /cmd_vel_relocalization
        timeout: 0.5
        priority: 60


velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 25.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true

    # 0.8 m/s desired mission speed, while retaining some headroom.
    max_velocity: [1.0, 0.0, 1.6]
    min_velocity: [-1.0, 0.0, -1.6]

    # Match the kinematic limits chosen for the controller tune.
    max_accel: [1.00, 0.0, 1.00]
    max_decel: [-1.40, 0.0, -1.80]

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 0.4
    odom_topic: /diff_drive_controller/odom
    odom_duration: 0.1


collision_monitor:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_footprint
    odom_frame_id: odom
    transform_tolerance: 0.2
    base_shift_correction: true

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe_auto
    enable_stamped_cmd_vel: true

    state_topic: /collision_monitor_state
    source_timeout: 0.3
    stop_pub_timeout: 2.0

    # Simple fixed frontal zones. The old forward/backward/stopped
    # velocity sub-polygons are removed.
    polygons:
      - stop_zone
      - slowdown_zone

    # Requested stop strip: x = 0.30 .. 0.40 m from base_footprint.
    # Keep the existing +/-0.30 m lateral span.
    stop_zone:
      type: polygon
      action_type: stop
      min_points: 5
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
      points: "[[0.40, 0.225], [0.40, -0.225], [0.30, -0.225], [0.30, 0.225]]"

    # 10 cm margin around the stop zone.
    slowdown_zone:
      type: polygon
      action_type: slowdown
      min_points: 5
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
      points: "[[0.50, 0.325], [0.50, -0.325], [0.30, -0.325], [0.30, 0.325]]"

    observation_sources:
      - depth_scan

    depth_scan:
      type: scan
      topic: /camera/camera/depth/scan
      source_timeout: 0.3
      enabled: true


# Final arbitration after collision monitoring.
# Autonomous motion is protected by collision_monitor. Manual teleop has higher
# priority and bypasses collision_monitor so the operator can back the robot out
# of a stop condition. Use manual override deliberately: it is not collision-protected.
manual_override_mux:
  ros__parameters:
    use_stamped: true

    topics:
      safe_auto:
        topic: /cmd_vel_safe_auto
        timeout: 0.5
        priority: 10

      manual:
        topic: /cmd_vel_manual
        timeout: 0.25
        priority: 100
