controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:

    # ==========================================
    # Wheel joints
    # ==========================================

    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint


    # ==========================================
    # Robot geometry
    # Values currently defined in your Xacro
    # ==========================================

    wheel_radius: 0.050
    wheel_separation: 0.420

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0


    # ==========================================
    # Frames
    # ==========================================

    odom_frame_id: odom
    base_frame_id: base_footprint


    # ==========================================
    # Odometry feedback
    # ==========================================

    open_loop: false
    position_feedback: true

    # Production EKF is the sole odom -> base_footprint TF owner.
    enable_odom_tf: false


    # ==========================================
    # Publishing
    # ==========================================

    publish_rate: 100.0

    velocity_rolling_window_size: 10

    publish_limited_velocity: true


    # ==========================================
    # Command safety
    # ==========================================

    cmd_vel_timeout: 0.5


    # ==========================================
    # Velocity limits
    # ==========================================

    linear.x.has_velocity_limits: true
    # Straight-line kinematic cap from 100 RPM, r=0.050 m.
    # Combined (v, omega) feasibility is enforced downstream by the
    # shared wheel_speed_limiter before collision_monitor.
    linear.x.max_velocity: 0.5235987756
    linear.x.min_velocity: -0.5235987756
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.4933275029
    angular.z.min_velocity: -2.4933275029