twist_mux:
  ros__parameters:

    use_stamped: true

    topics:

      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10

      final_approach:
        topic: /cmd_vel_approach
        timeout: 0.25
        priority: 50

      relocalization:
        topic: /cmd_vel_relocalization
        timeout: 0.5
        priority: 60

      collision_recovery:
        topic: /cmd_vel_collision_recovery
        timeout: 0.25
        priority: 90

      manual:
        topic: /cmd_vel_manual
        timeout: 0.25
        priority: 100
