collision_monitor:
  ros__parameters:

    use_sim_time: true

    bond_timeout: 10.0

    # -------------------------------------------------
    # Frames
    # -------------------------------------------------

    base_frame_id: base_footprint
    odom_frame_id: odom

    transform_tolerance: 0.2

    # Correct obstacle positions for robot motion between
    # point cloud timestamp and current control cycle.
    base_shift_correction: true

    # -------------------------------------------------
    # Velocity pipeline
    # -------------------------------------------------

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel

    enable_stamped_cmd_vel: true

    # Publish active collision state for debugging.
    state_topic: /collision_monitor_state

    # If sensor data disappears, fail safe.
    source_timeout: 0.3

    # Continue publishing zero velocity temporarily
    # after a stop is triggered.
    stop_pub_timeout: 2.0

    # -------------------------------------------------
    # Safety zones
    # -------------------------------------------------

    polygons:
      - stop_zone
      - slowdown_zone

    # =================================================
    # STOP ZONE
    # =================================================

    stop_zone:
      type: polygon
      points: "[[0.55, 0.30], [0.55, -0.30], [0.35, -0.30], [0.35, 0.30]]"
      action_type: stop
      min_points: 5
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true

    # =================================================
    # SLOWDOWN ZONE
    # =================================================

    slowdown_zone:
      type: polygon
      points: "[[0.75, 0.60], [0.75, -0.60], [0.35, -0.60], [0.35, 0.60]]"
      action_type: slowdown
      min_points: 5
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true

    # -------------------------------------------------
    # Observation sources
    # -------------------------------------------------

    observation_sources:
      - depth_scan

    depth_scan:
      type: scan
      topic: /camera/camera/depth/scan
      source_timeout: 0.3
      enabled: true
