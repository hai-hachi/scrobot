world: badminton_court

# Coordinate convention used by the shuttle distribution:
#   Side A = +X half of the court
#   Side B = -X half of the court
#   Left   = +Y half of the court
#   Right  = -Y half of the court

single:
  # Defaults for mode:=single. These X/Y values can be overridden directly
  # from the launch command, for example:
  # ros2 launch scrobot_simulation spawn_shuttles.launch.py \
  #   mode:=single batch:=101 x:=-4.225 y:=-1.525
  x: 0.0
  y: 0.0
  z: 0.08
  roll: 0.0
  pitch: 1.57079632679
  yaw: 0.0

random:
  count: 20
  seed: null
  density: uniform

cluster:
  count: 50
  seed: null
  sigma_x: 0.10
  sigma_y: 0.90
  left_center_y: 1.525
  right_center_y: -1.525

  line_x:
    side_a_singles_long: 6.70
    side_a_doubles_long: 5.94
    side_a_short: 1.98
    net: 0.00
    side_b_short: -1.98
    side_b_doubles_long: -5.94
    side_b_singles_long: -6.70

  weights:
    - [1.0, 0.0]
    - [0.0, 1.0]
    - [0.2, 0.8]
    - [1.0, 0.3]
    - [0.7, 0.3]
    - [0.0, 1.0]
    - [1.0, 0.0]

mixed:
  count: 50
  seed: null
  random_fraction: 0.30
  random_density: uniform

court:
  length: 13.40
  width: 6.10
  margin: 0.15

spawn:
  height: 0.08
  parallel_workers: 8
