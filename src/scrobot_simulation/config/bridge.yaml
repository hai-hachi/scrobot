# ============================================================
# Gazebo Harmonic -> ROS 2 Jazzy bridge
# D435i-like simulation + separate 5883L magnetometer
# ============================================================

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK


# ============================================================
# D435i combined IMU
# ============================================================
#
# Preserve the RealSense-like camera topic:
#   /camera/camera/imu
#
# AND expose the same Gazebo IMU stream at the robot-level topic:
#   /imu/data_raw
#
# Both messages use camera_imu_optical_frame because the data
# originate from the D435i IMU, regardless of ROS topic name.
# ============================================================

- ros_topic_name: "/camera/camera/imu"
  gz_topic_name: "/camera/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_imu_frame"

- ros_topic_name: "/imu/data_raw"
  gz_topic_name: "/camera/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_imu_frame"


# ============================================================
# Separate 5883L magnetometer
# ============================================================

- ros_topic_name: "/imu/mag"
  gz_topic_name: "/imu/mag"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "mag_link"


# ============================================================
# Color camera
# ============================================================

- ros_topic_name: "/camera/camera/color/image_raw"
  gz_topic_name: "/camera/color"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_color_optical_frame"

- ros_topic_name: "/camera/camera/color/camera_info"
  gz_topic_name: "/camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_color_optical_frame"


# ============================================================
# Raw depth camera
# ============================================================

- ros_topic_name: "/camera/camera/depth/image_rect_raw"
  gz_topic_name: "/camera/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_depth_optical_frame"

- ros_topic_name: "/camera/camera/depth/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_depth_optical_frame"


# ============================================================
# Point cloud
# ============================================================
#
# Do NOT bridge Gazebo's native depth point cloud here.
# depth_registration.launch.py builds XYZ from the ROS depth image
# and CameraInfo so it is correctly expressed in
# camera_depth_optical_frame.
