# ============================================================
# Native Gazebo depth point cloud
# ============================================================
#
# Simulation backend:
#   /camera/points (Gazebo)
#       -> ros_gz_bridge
#       -> /camera/camera/depth/points (ROS)
#
# This replaces depth_image_proc::PointCloudXyzNode in simulation.
# ============================================================

- ros_topic_name: "/camera/camera/depth/points"
  gz_topic_name: "/camera/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

  qos_profile: SENSOR_DATA
  publisher_queue: 1
  lazy: true

  frame_id: "camera_depth_frame"

# Gazebo world ground truth for evaluation only.
- ros_topic_name: /evaluation/ground_truth_tf
  gz_topic_name: /world/badminton_court/dynamic_pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  lazy: false

# ============================================================
# Dedicated Gazebo ground truth odometry for local evaluation
# ============================================================
- ros_topic_name: /evaluation/ground_truth_odom
  gz_topic_name: /evaluation/scrobot/ground_truth_odom_gz
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  publisher_queue: 1

