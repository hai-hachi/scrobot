# ============================================================
# Gazebo Harmonic -> ROS 2 Jazzy bridge
# D435i-like simulation + optional legacy 5883L magnetometer
# ============================================================

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# ============================================================
# D435i combined IMU
# ============================================================
- ros_topic_name: "/camera/camera/imu"
  gz_topic_name: "/camera/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  frame_id: "camera_imu_optical_frame"

# ============================================================
# Optional legacy 5883L magnetometer.
# The bridge can remain present when the simulated sensor is disabled; no
# /imu/mag messages will be produced in that configuration.
# ============================================================
- ros_topic_name: "/imu/mag"
  gz_topic_name: "/imu/mag"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "mag_link"

# ============================================================
# Color camera
# ============================================================
- ros_topic_name: "/camera/camera/color/camera_info"
  gz_topic_name: "/camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_color_optical_frame"

# ============================================================
# Raw depth camera
# ============================================================
- ros_topic_name: "/camera/camera/depth/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_depth_optical_frame"

# ============================================================
# Native Gazebo depth point cloud
#
# Keep camera_depth_frame here. This Gazebo bridge/frame combination has
# already been validated visually in RViz for this project. The captured
# physical D435i log confirms the depth CameraInfo/TF optical frames, but it
# does not include an enabled PointCloud2 topic from which a real point-cloud
# frame_id could be verified. Do not infer a frame rename from CameraInfo alone.
# ============================================================
- ros_topic_name: "/camera/camera/depth/points"
  gz_topic_name: "/camera/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  publisher_queue: 1
  lazy: true
  frame_id: "camera_depth_frame"

# ============================================================
# Evaluation / simulation ground truth
# ============================================================

# Dedicated shuttle-only ground truth produced by ShuttleManagerSystem.
- ros_topic_name: /evaluation/shuttle_ground_truth
  gz_topic_name: /evaluation/shuttle_ground_truth_gz
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  publisher_queue: 1
  lazy: false

# One-shot physical collection events. Each pose is the world pose of a shuttle
# immediately before ShuttleManagerSystem requests removal from Gazebo.
- ros_topic_name: /evaluation/shuttle_collected
  gz_topic_name: /evaluation/shuttle_collected_gz
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  publisher_queue: 10
  lazy: false

# Dedicated Gazebo ground truth odometry for local evaluation.
- ros_topic_name: /evaluation/ground_truth_odom
  gz_topic_name: /evaluation/scrobot/ground_truth_odom_gz
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  publisher_queue: 1
