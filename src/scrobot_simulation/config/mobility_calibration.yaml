# Simulation-only SCROBOT mobility calibration.
# Published from Mobility Lab SAVED settings; do not edit real robot.
# Apply after restarting the normal Gazebo simulation.
# No motor PID is added to the physical robot.
schema_version: 1
physics:
  drive_contact_mu: 5.0
  caster_contact_mu: 0.05
  wheel_joint_damping: 0.0
  wheel_collision_width: 0.001
  drive_slip1: 0.0
  drive_slip2: 0.0
motor:
  model: first_order
  tau_left: 0.05
  tau_right: 0.05
  gain_left: 1.0
  gain_right: 1.0
