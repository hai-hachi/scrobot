# ============================================================
# SCROBOT NAV2 CONFIGURATION
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Stronger than default so the global path prefers the middle of free
      # corridors instead of clipping the inflated halo around poles/tags.
      cost_travel_multiplier: 3.5
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 25.0
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath, SweepPath]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.0523598776
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.85
      lookahead_dist: 0.55
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.90
      lookahead_time: 0.90
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.60
      transform_tolerance: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.30
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.90
      cost_scaling_gain: 0.80
      inflation_cost_scaling_factor: 2.5
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.85
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 1.8
      allow_reversing: false

    SweepPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.55
      lookahead_dist: 0.32
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.50
      lookahead_time: 0.55
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.45
      transform_tolerance: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.65
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.20
      regulated_linear_scaling_min_speed: 0.18
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.90
      cost_scaling_gain: 0.80
      inflation_cost_scaling_factor: 2.5
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.60
      rotate_to_heading_min_angle: 0.45
      max_angular_accel: 1.4
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 12.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.30
      track_unknown_space: false
      footprint: '[[0.325, -0.225], [0.325,  0.225], [-0.335,  0.225], [-0.335, -0.225]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /camera/camera/depth/scan
          data_type: LaserScan
          sensor_frame: ""
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.90
        cost_scaling_factor: 2.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 6.0
      publish_frequency: 3.0
      rolling_window: false
      resolution: 0.05
      width: 15
      height: 8
      origin_x: -7.50
      origin_y: -4.00
      track_unknown_space: false
      transform_tolerance: 0.30
      footprint: '[[0.325, -0.225], [0.325,  0.225], [-0.335,  0.225], [-0.335, -0.225]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /camera/camera/depth/scan
          data_type: LaserScan
          sensor_frame: ""
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.90
        cost_scaling_factor: 2.5

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 20.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    enable_stamped_cmd_vel: true
    simulate_ahead_time: 1.5

    max_rotational_vel: 0.70
    min_rotational_vel: 0.18
    rotational_acc_lim: 1.40
