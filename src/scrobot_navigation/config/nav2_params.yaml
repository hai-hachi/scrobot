# ============================================================
# SCROBOT NAV2 CONFIGURATION
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 25.0
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.0873   # 5 deg
      stateful: true

    # ----------------------------------------------------------
    # RPP - 0.8 m/s sweep tune
    # ----------------------------------------------------------
    FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

        # Desired cruise speed
        desired_linear_vel: 0.80

        # Adaptive Pure Pursuit lookahead. Keep the same 0.70 s preview time
        # that worked at 0.50 m/s. At 0.80 m/s this gives 0.56 m lookahead.
        lookahead_dist: 0.56
        use_velocity_scaled_lookahead_dist: true
        lookahead_time: 0.70
        min_lookahead_dist: 0.35
        max_lookahead_dist: 0.56

        # Curvature regulation. R_min remains 0.50 m.
        # At v=0.80 m/s, v/R_min = 1.60 rad/s.
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.50

        # Preserve the same R_floor ~= 0.20 m interpretation used before:
        # v_min = 0.80 * 0.20 / 0.50 = 0.32 m/s.
        regulated_linear_scaling_min_speed: 0.32

        # Keep obstacle-cost regulation disabled while tuning motion response.
        use_cost_regulated_linear_velocity_scaling: false

        # Keep rotate-to-heading: required for clean NavigateToPose completion
        # and sweep-path rejoin after XY tolerance is reached.
        use_rotate_to_heading: true
        rotate_to_heading_angular_vel: 1.60
        rotate_to_heading_min_angle: 0.3491   # 20 deg
        max_angular_accel: 1.00
        allow_reversing: false

        # Goal approach slowdown. Kinematic stopping distance at 0.80 m/s and
        # 1.0 m/s^2 is 0.32 m; use roughly 2x for a comfortable handoff.
        min_approach_linear_velocity: 0.10
        approach_velocity_scaling_dist: 0.64

        # Collision projection. Braking time from 0.80 m/s at 1.0 m/s^2 is
        # approximately 0.80 s. Projection is still capped at the carrot.
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 0.80

        transform_tolerance: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 12.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.30
      track_unknown_space: false
      footprint: '[[0.325, -0.225], [0.325,  0.225], [-0.335,  0.225], [-0.335, -0.225]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /camera/camera/depth/scan
          data_type: LaserScan
          sensor_frame: ""
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 6.0
      publish_frequency: 3.0
      rolling_window: false
      resolution: 0.05
      width: 18
      height: 8
      origin_x: -9.00
      origin_y: -4.00
      track_unknown_space: false
      transform_tolerance: 0.30
      footprint: '[[0.325, -0.225], [0.325,  0.225], [-0.335,  0.225], [-0.335, -0.225]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /camera/camera/depth/scan
          data_type: LaserScan
          sensor_frame: ""
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 20.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    enable_stamped_cmd_vel: true
    simulate_ahead_time: 1.5

    max_rotational_vel: 1.60
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.00
