# ============================================================
# SCROBOT NAV2 CONFIGURATION
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 25.0
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.1745329252   # 10 deg
      stateful: true

    # ----------------------------------------------------------
    # BASELINE RPP TEST
    # ----------------------------------------------------------
    # Keep this deliberately simple while tuning the sweep path.
    # Tune only these first:
    #   1) desired_linear_vel
    #   2) lookahead_dist
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      # Core test variables
      desired_linear_vel: 0.40
      lookahead_dist: 0.30

      # Keep lookahead fixed so speed/lookahead effects are easy to identify.
      use_velocity_scaled_lookahead_dist: false

      # Disable RPP's extra curvature-speed regulation for the baseline test.
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false

      # Follow the continuous snake; do not stop and rotate toward path headings.
      use_rotate_to_heading: false
      allow_reversing: false

      # Keep obstacle safety active.
      use_collision_detection: true
      transform_tolerance: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 12.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.30
      track_unknown_space: false
      footprint: '[[0.325, -0.225], [0.325,  0.225], [-0.335,  0.225], [-0.335, -0.225]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /camera/camera/depth/scan
          data_type: LaserScan
          sensor_frame: ""
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 6.0
      publish_frequency: 3.0
      rolling_window: false
      resolution: 0.05
      width: 18
      height: 8
      origin_x: -9.00
      origin_y: -4.00
      track_unknown_space: false
      transform_tolerance: 0.30
      footprint: '[[0.325, -0.225], [0.325,  0.225], [-0.335,  0.225], [-0.335, -0.225]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /camera/camera/depth/scan
          data_type: LaserScan
          sensor_frame: ""
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 20.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    enable_stamped_cmd_vel: true
    simulate_ahead_time: 1.5

    max_rotational_vel: 0.70
    min_rotational_vel: 0.18
    rotational_acc_lim: 1.40
