global_sweep_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    autostart: true
    court_length: 13.40
    court_width: 6.10
    tf_timeout: 0.05

    # Final sweep manager forces exactly four lanes and extends only the first
    # entry / last exit 0.80 m beyond the playable court. The side margin keeps
    # the outer lanes clear of the tag poles while preserving camera coverage.
    sweep_lane_spacing: 1.45
    sweep_waypoint_spacing: 0.30
    sweep_margin_x: 0.60
    sweep_margin_y: 0.90
    sweep_controller_id: SweepPath
    sweep_start_retries: 2

    # Global route order uses the corrected frozen survey map. Nav2 approaches
    # a staging pose, then live vision / collector TF owns the final intercept.
    pickup_offset_x: 0.165
    collection_overrun: 0.03
    two_opt_max_passes: 100
    collection_target_retries: 2
    collection_staging_distance: 0.85
    visual_intercept_action: /visual_intercept
    visual_intercept_retries: 1

    # Absolute-pose refresh. After the survey, all recorded shuttle coordinates
    # are rigidly remapped by T_new(map<-odom) * inv(T_old(map<-odom)). During
    # the longer collection run the same correction happens every 8 targets.
    post_sweep_relocalize: true
    collection_relocalize_every: 8
    runtime_tag_distance: 1.70
    runtime_relocalize_sample_count: 12
    runtime_relocalize_timeout: 10.0

    # Persistent confirmed map-frame tracker output recorded during the sweep.
    tracked_shuttles_topic: /perception/tracked_shuttles

    # Initial global localization.
    initial_global_localization: true
    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0
    relocalize_sample_count: 15
    relocalize_timeout: 15.0
    relocalize_retries: 4

    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_activation_guard: 0.20
    route_goal_retries: 2
    control_period: 0.10

visual_intercept_controller:
  ros__parameters:
    use_sim_time: true
    visible_topic: /perception/visible_tracked_shuttles
    action_name: /visual_intercept
    cmd_vel_topic: /cmd_vel_approach
    tracking_frame: map
    base_frame: base_link
    collector_frame: collector_link
    control_rate: 25.0
    tf_timeout: 0.05

    # Search briefly at the staging pose if the target is not initially in the
    # camera view. Once acquired, camera loss near the collector is expected.
    acquisition_timeout: 4.0
    acquisition_scan_speed: 0.18
    lost_grace: 0.35
    intercept_timeout: 10.0

    pickup_offset_x: 0.165
    target_capture_x: 0.23
    target_capture_y: 0.11

    # Final success is geometry based, not timer based. The last observed
    # shuttle point must pass 5 cm behind collector_link while staying inside
    # the collector lateral corridor. TF continuation is bounded for safety.
    collector_overrun_distance: 0.05
    collector_lateral_tolerance: 0.13
    blind_tf_timeout: 3.0
    blind_overrun_time: 0.55

    linear_kp: 0.85
    angular_kp: 2.40
    min_linear_speed: 0.08
    max_linear_speed: 0.28
    max_angular_speed: 0.70
    heading_slowdown_angle: 0.30
