shuttle_target_selector:
  ros__parameters:
    use_sim_time: true

    tracked_topic: /perception/tracked_shuttles
    target_request_topic: /mission/target_request_id
    selected_topic: /mission/selected_shuttle
    selected_id_topic: /mission/selected_shuttle_id
    staging_pose_topic: /mission/shuttle_staging_pose
    selection_enabled_topic: /mission/target_selection_enabled
    collection_complete_topic: /mission/collection_complete

    map_frame: map
    base_frame: base_footprint

    # Stop Nav2 this far before the requested shuttle. Final approach handles
    # the remaining distance into the collector.
    staging_distance: 0.75

    publish_rate: 5.0
    tf_timeout: 0.05

    # patrol_mission.launch.py overrides this to false; patrol_manager then
    # enables staging only after it has latched the first visible shuttle ID.
    enabled_at_start: true
