sweep_mission_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    odom_topic: /odometry/filtered

    # Mission interrupts only for collection-eligible shuttles: <= 2 m from
    # robot and outside the pole exclusion zones.
    raw_detection_topic: /perception/collectable_shuttle_detections_3d

    autostart: true
    tf_timeout: 0.05

    # ------------------------------------------------------------
    # Sweep geometry
    # ------------------------------------------------------------
    court_length: 13.40
    court_width: 6.10
    sweep_passes: 4

    # Camera coverage proxy:
    #   horizontal scan line ~= 0.50 m in front of base_link
    #   desired outside margin ~= 0.50 m
    # therefore only the first sweep entry begins 1.00 m outside.
    sweep_extension: 1.00
    sweep_path_resolution: 0.20
    turn_samples: 18

    # ------------------------------------------------------------
    # Fixed AprilTag relocalization stations
    # ------------------------------------------------------------
    pole_x: 0.0
    left_pole_y: 3.05
    right_pole_y: -3.05
    tag_mount_radius: 0.075
    tag_inward_angle_deg: 45.0
    fixed_stop_max_tag_distance: 4.0

    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0
    relocalize_sample_count: 15
    relocalize_timeout: 15.0

    # Every generated fixed station is used unconditionally. There is no
    # traveled-distance threshold before /relocalize becomes due.
    spin_time_allowance: 10.0

    # ------------------------------------------------------------
    # Sweep / local-collect integration
    # ------------------------------------------------------------
    join_acceptance_distance: 0.40
    enable_shuttle_interrupts: true

    # Keep the existing test controls available while integrating collection.
    enable_test_controls: true
    test_command_topic: /mission/test_command
    test_goal_topic: /mission/test_goal
    accept_rviz_goal_topic: true
    rviz_goal_topic: /goal_pose

    local_collect_timeout: 120.0

    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    action_retry_period: 0.25
    controller_id: FollowPath
    goal_checker_id: ''
    progress_checker_id: ''
