final_approach_controller:
  ros__parameters:
    use_sim_time: true

    tracked_topic: /perception/tracked_shuttles
    raw_detection_topic: /perception/shuttle_detections_3d
    action_name: /collect_shuttle
    simulation_collection_topic: /evaluation/shuttle_collected
    cmd_vel_topic: /cmd_vel_approach

    tracking_frame: map
    base_frame: base_link

    control_rate: 25.0
    timeout: 20.0
    tf_timeout: 0.05

    linear_kp: 1.10
    angular_kp: 2.40
    min_linear_speed: 0.05
    max_linear_speed: 0.30
    max_angular_speed: 1.20

    heading_slowdown_angle: 0.35
    rotate_only_angle: 0.75

    # The persistent map track is only used to identify the first camera target.
    # It is deliberately a loose gate; after lock, global localization is no
    # longer used to steer the pickup motion.
    startup_association_distance: 1.00

    # Live camera detections are transformed directly into base_link and tracked
    # frame-to-frame. A slightly wider gate tolerates shuttle motion after contact.
    camera_association_distance: 0.50

    # When the shuttle passes below the camera near the collector, continue a
    # short, slow local commit using the last camera-relative direction. Gazebo
    # contact remains the only success condition, so this cannot create a false
    # collection result.
    camera_lost_grace_time: 1.00
    blind_forward_speed: 0.10

    collection_event_match_distance: 0.50
