final_approach_controller:
  ros__parameters:
    use_sim_time: true

    tracked_topic: /perception/tracked_shuttles
    raw_detection_topic: /perception/shuttle_detections_3d
    action_name: /collect_shuttle
    simulation_collection_topic: /evaluation/shuttle_collected
    cmd_vel_topic: /cmd_vel_approach
    collection_phase_topic: /mission/collection_phase
    collection_outcome_topic: /mission/collection_outcome

    tracking_frame: map
    base_frame: base_link
    odom_frame: odom

    control_rate: 25.0
    tf_timeout: 0.05

    # Acquire one local snapshot of the locked group, then ignore later
    # perception changes for the rest of the pass.
    acquisition_timeout: 0.75
    startup_association_distance: 1.00

    # ALIGN: rotate toward the group corridor as well as possible, but never
    # block forever waiting for perfect alignment.
    align_kp: 2.40
    align_tolerance: 0.0523598776   # 3 deg
    align_timeout: 2.0
    min_align_speed: 0.15
    max_align_speed: 1.20

    # DRIVE: fixed straight pass measured with odom -> base_link.
    pickup_offset_x: 0.165
    overrun_margin: 0.10
    minimum_drive_distance: 0.10
    drive_speed: 0.20
    drive_timeout: 20.0

    # Simulation-only matching of Gazebo collection events to intended IDs.
    # This affects the outcome topic only; it never stops the maneuver.
    collection_event_match_distance: 0.50
