final_approach_controller:
  ros__parameters:
    use_sim_time: true

    tracked_topic: /perception/tracked_shuttles
    raw_detection_topic: /perception/shuttle_detections_3d
    action_name: /collect_shuttle
    simulation_collection_topic: /evaluation/shuttle_collected
    cmd_vel_topic: /cmd_vel_approach

    tracking_frame: map
    base_frame: base_link

    control_rate: 25.0
    timeout: 20.0
    tf_timeout: 0.05

    linear_kp: 1.10
    angular_kp: 2.40
    min_linear_speed: 0.05
    max_linear_speed: 0.30
    max_angular_speed: 1.20

    heading_slowdown_angle: 0.35
    rotate_only_angle: 0.75

    # Map track is only a loose one-time hint for acquiring the currently
    # visible raw camera target. It must not block the local approach.
    startup_association_distance: 1.00

    # After initial camera acquisition, follow the target locally from one
    # camera sample to the next. No map localization is used for steering.
    camera_association_distance: 0.45

    # If the shuttle drops below the camera FOV immediately before pickup,
    # continue briefly along the last camera-local direction. Gazebo collection
    # contact remains the only success condition.
    camera_lost_grace_time: 0.70
    blind_forward_speed: 0.08

    collection_event_match_distance: 0.50
