final_approach_controller:
  ros__parameters:
    use_sim_time: true

    # Persistent track is used only to identify which raw camera detection is
    # the locked shuttle. Driving itself uses the live camera-local 3D point.
    tracked_topic: /perception/tracked_shuttles
    raw_detection_topic: /perception/shuttle_detections_3d
    action_name: /collect_shuttle
    simulation_collection_topic: /evaluation/shuttle_collected
    cmd_vel_topic: /cmd_vel_approach

    tracking_frame: map
    base_frame: base_link

    control_rate: 25.0
    timeout: 20.0
    tf_timeout: 0.05

    linear_kp: 1.10
    angular_kp: 2.40
    min_linear_speed: 0.05
    max_linear_speed: 0.30
    max_angular_speed: 1.20

    heading_slowdown_angle: 0.35
    rotate_only_angle: 0.75

    # Associate the locked persistent ID with the nearest live camera 3D
    # measurement in base_link. This keeps pickup local even if map localization
    # drifts slightly after staging.
    camera_association_distance: 0.35

    # The camera may lose the shuttle just before it reaches the collector
    # because it is too close / below the FOV. Continue slowly along the last
    # local bearing for a short time while Gazebo remains the success authority.
    camera_lost_grace_time: 0.70
    blind_forward_speed: 0.08

    collection_event_match_distance: 0.50
