patrol_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    autostart: true

    # Patrol grid
    court_length: 13.40
    court_width: 6.10
    camera_range: 3.0
    range_factor: 0.90
    max_grid_size: 20
    tf_timeout: 0.05

    # First-visible primary selection stays intentionally simple. During a spin,
    # keep rotating after the first confirmed shuttle is seen so nearby shuttles
    # around it can enter the FOV. Stop when the primary reaches about 26 deg
    # toward the opposite camera edge.
    primary_scan_edge_bearing: 0.45
    target_lost_timeout: 0.75

    # Once the scan stops, hold still briefly before locking the group.
    group_settle_time: 0.40
    group_lateral_tolerance: 0.15
    group_longitudinal_tolerance: 0.25

    # Hybrid collection: Nav2 moves to a staging pose this far behind the locked
    # group along the current robot->group approach direction. The staging yaw
    # points toward the group. Local CollectShuttle then performs ALIGN -> DRIVE.
    staging_distance: 0.80

    # Initial absolute localization.
    initial_global_localization: true
    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0
    relocalize_sample_count: 15
    relocalize_timeout: 15.0
    relocalize_retries: 4

    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_tf_settle_time: 0.75
    navigation_goal_retries: 3
    action_retry_period: 0.5

    # Scan behavior
    spin_angle: 6.283185307179586
    spin_time_allowance: 20.0

    visible_tracks_topic: /perception/visible_tracked_shuttles
    collect_action_name: /collect_shuttle
