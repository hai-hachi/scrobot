patrol_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    odom_topic: /odometry/filtered
    autostart: true

    # Patrol grid
    court_length: 13.40
    court_width: 6.10
    camera_range: 3.0
    range_factor: 0.90
    max_grid_size: 20
    tf_timeout: 0.05

    # Keep enough image margin for scan cancellation at the higher spin speed.
    primary_scan_edge_bearing: 0.38
    target_lost_timeout: 0.65

    group_settle_time: 0.25
    group_lateral_tolerance: 0.15
    group_longitudinal_tolerance: 0.25

    staging_distance: 0.80

    # Initial absolute localization.
    initial_global_localization: true
    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0
    relocalize_sample_count: 15
    relocalize_timeout: 15.0
    relocalize_retries: 4

    # Runtime relocalization uses accumulated ODOM PATH LENGTH.
    relocalize_due_distance: 15.0
    relocalize_required_distance: 30.0
    relocalize_opportunity_radius: 2.50
    left_tag_region_x: 0.0
    left_tag_region_y: 3.05
    right_tag_region_x: 0.0
    right_tag_region_y: -3.05

    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_tf_settle_time: 0.50
    navigation_goal_retries: 3
    action_retry_period: 0.25

    spin_angle: 6.283185307179586
    spin_time_allowance: 15.0

    visible_tracks_topic: /perception/visible_tracked_shuttles
    collect_action_name: /collect_shuttle
