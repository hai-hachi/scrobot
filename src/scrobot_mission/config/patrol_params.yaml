patrol_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    odom_topic: /odometry/filtered
    autostart: true

    # Patrol grid
    court_length: 13.40
    court_width: 6.10
    camera_range: 3.0
    range_factor: 0.90
    max_grid_size: 20
    tf_timeout: 0.05

    # First-visible primary stays simple. Keep scanning until the primary moves
    # near the opposite FOV edge so nearby shuttles can enter view.
    primary_scan_edge_bearing: 0.45
    target_lost_timeout: 0.75

    group_settle_time: 0.40
    group_lateral_tolerance: 0.15
    group_longitudinal_tolerance: 0.25

    # Nav2 obstacle-aware staging before local ALIGN -> DRIVE.
    staging_distance: 0.80

    # Initial absolute localization.
    initial_global_localization: true
    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0
    relocalize_sample_count: 15
    relocalize_timeout: 15.0
    relocalize_retries: 4

    # Runtime relocalization uses accumulated ODOM PATH LENGTH, not map
    # displacement. DUE is opportunistic; REQUIRED is the hard limit.
    relocalize_due_distance: 8.0
    relocalize_required_distance: 15.0

    # A DUE correction is only taken on RETURN_TO_PATROL when no shuttle is
    # visible and the robot is already close to either court pole/tag region.
    relocalize_opportunity_radius: 2.50
    left_tag_region_x: 0.0
    left_tag_region_y: 3.05
    right_tag_region_x: 0.0
    right_tag_region_y: -3.05

    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_tf_settle_time: 0.75
    navigation_goal_retries: 3
    action_retry_period: 0.5

    spin_angle: 6.283185307179586
    spin_time_allowance: 25.0

    visible_tracks_topic: /perception/visible_tracked_shuttles
    collect_action_name: /collect_shuttle
