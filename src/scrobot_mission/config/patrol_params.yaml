patrol_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    autostart: true

    # Patrol grid
    court_length: 13.40
    court_width: 6.10
    camera_range: 3.0
    range_factor: 0.90
    max_grid_size: 20
    tf_timeout: 0.05

    # First-seen shuttle grouping.
    # Once the first confirmed shuttle is locked, cancel the scan and keep the
    # robot stationary briefly so nearby confirmed tracks can stabilize.
    group_settle_time: 0.40

    # Group shuttles relative to the primary in robot-local coordinates.
    # Lateral tolerance corresponds to the +/-150 mm collector half-width.
    group_lateral_tolerance: 0.15

    # Prevent a shuttle far ahead on the same lateral line from joining the
    # same collection pass.
    group_longitudinal_tolerance: 0.25

    # Initial absolute localization
    initial_global_localization: true
    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0

    # Spawning a large shuttle population after this initial relocalization is
    # preferred so Gazebo / transport load is low during the stationary batch.
    relocalize_sample_count: 12
    relocalize_timeout: 12.0
    relocalize_retries: 3

    # Nav2 is now patrol-only. Shuttle collection does not use NavigateToPose.
    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_tf_settle_time: 0.75
    navigation_goal_retries: 3
    action_retry_period: 0.5

    # Scan until first confirmed visible shuttle, otherwise finish 360 deg.
    spin_angle: 6.283185307179586
    spin_time_allowance: 20.0

    visible_tracks_topic: /perception/visible_tracked_shuttles
    collect_action_name: /collect_shuttle
