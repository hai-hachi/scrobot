patrol_manager:
  ros__parameters:
    frame_id: map
    autostart: true

    # ========================================================
    # Patrol grid generation
    # ========================================================
    court_length: 13.40
    court_width: 6.10
    camera_range: 3.0
    range_factor: 0.90
    max_grid_size: 20

    # ========================================================
    # Initial absolute localization only
    # ========================================================
    initial_global_localization: true
    initial_tag_id: -1
    initial_relocalization_retries: 3

    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0

    relocalize_sample_count: 15
    relocalize_timeout: 7.0

    # ========================================================
    # Nav2 startup
    # ========================================================
    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_tf_settle_time: 0.75
    navigation_goal_retries: 3

    # ========================================================
    # Patrol / shuttle excursion behavior
    # ========================================================
    action_retry_period: 0.5
    spin_angle: 6.283185307179586
    spin_time_allowance: 20.0
    selection_wait_timeout: 2.0

    visible_tracks_topic: /perception/visible_tracked_shuttles
    selected_id_topic: /mission/selected_shuttle_id
    staging_pose_topic: /mission/shuttle_staging_pose
    selection_enabled_topic: /mission/target_selection_enabled

    # Final-approach / collector handoff. For now this can be tested manually:
    # request publishes the shuttle ID; complete must publish the same ID.
    collection_request_topic: /mission/collection_request
    collection_complete_topic: /mission/collection_complete
