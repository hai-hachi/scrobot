patrol_manager:
  ros__parameters:
    frame_id: map
    base_frame: base_footprint
    autostart: true

    # Patrol grid
    court_length: 13.40
    court_width: 6.10
    camera_range: 3.0
    range_factor: 0.90
    max_grid_size: 20
    tf_timeout: 0.05

    # First-seen shuttle grouping.
    # Cancel the scan as soon as the first confirmed shuttle is seen, then hold
    # still briefly so nearby visible tracks stabilize before the collection pass.
    group_settle_time: 0.40

    # Opportunistically collect shuttles lying in the same 300 mm corridor.
    # The +/-0.15 m lateral gate is measured perpendicular to robot forward.
    group_lateral_tolerance: 0.15

    # Keep the pass local: don't pull in a shuttle much farther ahead/behind the
    # primary just because it happens to share the same lateral corridor.
    group_longitudinal_tolerance: 0.25

    # Initial absolute localization. Large shuttle populations should be spawned
    # after this succeeds so camera/Gazebo load is low during tag sampling.
    initial_global_localization: true
    initial_tag_id: -1
    tag_approach_distance: 1.70
    tag_approach_timeout: 60.0
    relocalize_sample_count: 15
    relocalize_timeout: 15.0
    relocalize_retries: 4

    # Nav2 is patrol/return-only. Precision shuttle pickup is local camera servo,
    # so a curved Nav2 arrival cannot bias the final collection heading.
    nav2_lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    nav2_startup_timeout: 30.0
    nav2_startup_retries: 3
    nav2_tf_settle_time: 0.75
    navigation_goal_retries: 3
    action_retry_period: 0.5

    # Scan until first confirmed visible shuttle, otherwise finish 360 deg.
    spin_angle: 6.283185307179586
    spin_time_allowance: 20.0

    visible_tracks_topic: /perception/visible_tracked_shuttles
    collect_action_name: /collect_shuttle
