shuttle_collection_filter:
  ros__parameters:
    input_topic: /perception/shuttle_detections_3d
    output_topic: /perception/collectable_shuttle_detections_3d
    base_frame: base_link
    map_frame: map
    tf_timeout: 0.05

    # Only leave the sweep for nearby shuttles. Farther shuttles will be picked
    # up naturally on a later sweep pass instead of causing long out-and-back trips.
    max_target_range: 2.00

    # Ignore shuttles close to either badminton-net pole.
    pole_x: 0.0
    pole_y_positions: [3.05, -3.05]
    pole_exclusion_radius: 0.60

local_collect_controller:
  ros__parameters:
    # ------------------------------------------------------------
    # Topics / frames
    # ------------------------------------------------------------
    raw_detection_topic: /perception/collectable_shuttle_detections_3d
    action_name: /local_collect
    cmd_vel_topic: /cmd_vel_approach
    phase_topic: /mission/local_collect_phase
    odom_frame: odom
    base_frame: base_link
    collector_frame: collector_link

    # ------------------------------------------------------------
    # Timing / perception
    # ------------------------------------------------------------
    control_rate: 30.0
    tf_timeout: 0.05
    detection_max_age: 0.30

    # ------------------------------------------------------------
    # Target completion / duplicate rejection
    # ------------------------------------------------------------
    position_tolerance: 0.08
    overrun_distance: 0.10
    overrun_speed: 0.25
    target_timeout: 12.0
    reacquire_exclusion_radius: 0.12

    # ------------------------------------------------------------
    # Coupled local pursuit gains
    # ------------------------------------------------------------
    # v_max = 0.45 m/s and full-speed distance ~= 0.50 m:
    #   linear_kp = 0.45 / 0.50 = 0.90
    linear_kp: 0.90

    # Saturate at about 0.50 rad (28.6 deg) bearing:
    #   angular_kp = 1.60 / 0.50 = 3.20
    angular_kp: 3.20

    # Hard command limits for the calibrated real drive.
    max_linear_speed: 0.45
    max_angular_speed: 1.60

    # Kinematic command slew limits chosen for the project.
    max_linear_accel: 1.00
    max_angular_accel: 1.00

    # Stop forward motion and rotate when bearing exceeds this angle.
    heading_stop_deg: 70.0

    # Kinematic stopping distance at 0.45 m/s and 1.0 m/s^2 is about 0.10 m.
    # Keep extra margin for perception/control delay.
    slow_radius: 0.20
