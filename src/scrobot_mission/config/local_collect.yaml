shuttle_collection_filter:
  ros__parameters:
    input_topic: /perception/shuttle_detections_3d
    output_topic: /perception/collectable_shuttle_detections_3d
    base_frame: base_link
    map_frame: map
    tf_timeout: 0.05

    # Only leave the sweep for nearby shuttles. Farther shuttles will be picked
    # up naturally on a later sweep pass instead of causing long out-and-back trips.
    max_target_range: 2.00

    # Ignore shuttles close to either badminton-net pole.
    pole_x: 0.0
    pole_y_positions: [3.05, -3.05]
    pole_exclusion_radius: 0.60

local_collect_controller:
  ros__parameters:
    # ------------------------------------------------------------
    # Topics / frames
    # ------------------------------------------------------------
    raw_detection_topic: /perception/collectable_shuttle_detections_3d
    action_name: /local_collect
    cmd_vel_topic: /cmd_vel_approach
    phase_topic: /mission/local_collect_phase
    odom_frame: odom
    base_frame: base_link
    collector_frame: collector_link

    # ------------------------------------------------------------
    # Timing / perception
    # ------------------------------------------------------------
    control_rate: 30.0
    tf_timeout: 0.05
    detection_max_age: 0.30
    target_timeout: 12.0

    # ------------------------------------------------------------
    # Target handling
    # ------------------------------------------------------------
    position_tolerance: 0.08
    reacquire_exclusion_radius: 0.12

    # Stage the collector center 0.50 m before the frozen shuttle, align with
    # the shuttle, then switch to a straight collection pass.
    precollect_distance: 0.50
    straight_collect_speed: 0.30

    # Keep the proven physical overrun after the shuttle reaches the collector.
    overrun_distance: 0.10
    overrun_speed: 0.25

    # ------------------------------------------------------------
    # Sliding-mode pose controller
    # ------------------------------------------------------------
    # Collector-point model:
    #   e_x_dot     = v_R cos(e_theta) - v + e_y omega
    #   e_y_dot     = v_R sin(e_theta) - (c + e_x) omega
    #   e_theta_dot = omega_R - omega
    #
    # Sliding surface:
    #   s = e_theta + lambda e_y
    #
    # Control:
    #   omega = [omega_R + lambda v_R sin(e_theta)
    #            + k_s s + eta sat(s/phi)]
    #           / [1 + lambda(c + e_x)]
    #   v = v_R cos(e_theta) + e_y omega + k_x e_x
    smc_reference_speed: 0.50
    smc_lambda: 2.50
    smc_ks: 3.00
    smc_eta: 1.00
    smc_phi: 0.02
    smc_kx: 2.00
    collector_offset_c: 0.165

    # SMC command saturation used in the accepted simulation.
    smc_min_linear_speed: -0.20
    smc_max_linear_speed: 0.50
    smc_max_angular_speed: 2.00
    smc_denominator_guard: 0.10

    # When the moving virtual reference reaches the 0.50 m pre-pose, hold the
    # reference fixed and require these errors continuously for 0.20 s before
    # starting the straight 0.30 m/s collection pass.
    prepose_ex_tolerance: 0.005
    prepose_ey_tolerance: 0.005
    prepose_yaw_tolerance_deg: 0.50
    prepose_stable_time: 0.20

    # Kinematic slew limits retained from the robot controller design.
    max_linear_accel: 1.00
    max_angular_accel: 1.00
