local_collect_controller:
  ros__parameters:
    # ------------------------------------------------------------
    # Topics / frames
    # ------------------------------------------------------------
    raw_detection_topic: /perception/shuttle_detections_3d
    action_name: /local_collect
    cmd_vel_topic: /cmd_vel_approach
    phase_topic: /mission/local_collect_phase
    odom_frame: odom
    base_frame: base_link
    collector_frame: collector_link

    # ------------------------------------------------------------
    # Timing / perception
    # ------------------------------------------------------------
    control_rate: 30.0
    tf_timeout: 0.05
    detection_max_age: 0.30

    # ------------------------------------------------------------
    # Target completion / duplicate rejection
    # ------------------------------------------------------------
    position_tolerance: 0.08
    target_timeout: 12.0
    reacquire_exclusion_radius: 0.12

    # ------------------------------------------------------------
    # Coupled local pursuit gains
    # ------------------------------------------------------------
    # v_max = 0.80 m/s and full-speed distance ~= 0.50 m:
    #   linear_kp = 0.80 / 0.50 = 1.60
    linear_kp: 1.60

    # Keep angular saturation at roughly the same 0.50 rad (28.6 deg)
    # bearing as the previous tune:
    #   angular_kp = 1.60 / 0.50 = 3.20
    angular_kp: 3.20

    # Hard command limits. R_min = 0.50 m at 0.80 m/s requires
    # omega = v / R = 1.60 rad/s.
    max_linear_speed: 0.80
    max_angular_speed: 1.60

    # Kinematic command slew limits chosen for the project.
    max_linear_accel: 1.00
    max_angular_accel: 1.00

    # Stop forward motion and rotate when bearing exceeds this angle.
    heading_stop_deg: 70.0

    # v^2/(2a) at 0.80 m/s and 1.0 m/s^2 is 0.32 m, so begin the
    # extra final-approach distance scaling just outside that distance.
    slow_radius: 0.35
