/camera/camera:
  ros__parameters:
    # Real robot profile tested on the Pi.
    enable_color: true
    rgb_camera.color_profile: "1280,720,15"
    rgb_camera.color_format: "RGB8"

    enable_depth: true
    depth_module.depth_profile: "848,480,15"
    depth_module.depth_format: "Z16"

    enable_infra: false
    enable_infra1: false
    enable_infra2: false

    enable_gyro: true
    enable_accel: true
    unite_imu_method: 2

    # Align depth to color for the future shuttle RGB-D localizer.
    align_depth.enable: true
    enable_sync: true

    # Generate obstacle point cloud locally on the Pi.
    pointcloud.enable: true
    pointcloud.stream_filter: 2
    pointcloud.stream_index_filter: 0
    pointcloud.ordered_pc: false
    pointcloud.allow_no_texture_points: true

    # robot_state_publisher owns the camera TF tree to avoid duplicate TF.
    publish_tf: false

    # Keep reconnect behavior robust to USB replug during development.
    initial_reset: false
    reconnect_timeout: 6.0
    diagnostics_period: 1.0
