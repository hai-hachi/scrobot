shuttle_tracker:
  ros__parameters:
    use_sim_time: true

    input_topic: /perception/shuttle_detections_3d
    output_topic: /perception/tracked_shuttles
    visible_output_topic: /perception/visible_tracked_shuttles

    tracking_frame: map

    publish_rate: 10.0

    # Match detections to an existing map track when they stay reasonably close.
    # Keep this modest: making it too large can merge two nearby shuttles.
    association_distance: 0.40

    # EMA smoothing of confirmed/tentative track position.
    position_alpha: 0.40

    # A new object must be observed consistently before mission logic sees it.
    min_confirmations: 2

    # Tentative false/one-frame detections may expire quickly.
    tentative_timeout: 0.75

    # 0.0 = confirmed tracks never expire automatically. A confirmed shuttle
    # remains in the court map when the camera turns away and should eventually
    # be removed explicitly after collection.
    confirmed_retention_timeout: 0.0

    # A confirmed track counts as currently visible only if refreshed recently.
    visible_timeout: 0.35

    tf_timeout: 0.05
    fallback_to_latest_tf: true

    default_class_id: shuttle
