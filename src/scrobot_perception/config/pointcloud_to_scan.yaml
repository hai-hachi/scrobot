depth_pointcloud_to_scan:
  ros__parameters:
    use_sim_time: true

    # Transform PointCloud2 into the robot frame before filtering/projection.
    target_frame: base_footprint
    transform_tolerance: 0.05

    # Robot-relevant vertical obstacle band.
    min_height: 0.08
    max_height: 0.60

    # D435i horizontal field of view, approximately 87 deg.
    angle_min: -0.76
    angle_max: 0.76
    angle_increment: 0.00872664626

    # Camera / scan timing.
    scan_time: 0.06666666667

    # Useful depth range for navigation and collision monitoring.
    range_min: 0.20
    range_max: 3.00

    # Fresh measurements are more important than queued stale data.
    queue_size: 1
    use_inf: true
