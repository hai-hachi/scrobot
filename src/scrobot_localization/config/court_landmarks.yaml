tag_global_localizer:
  ros__parameters:

    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    detections_topic: /apriltag/detections
    observed_tag_prefix: observed_tag_

    min_decision_margin: 20.0
    max_tag_distance: 6.0
    publish_rate: 30.0


    # ========================================================
    # SIDE A
    #
    # Tags 0 and 1 are visible from +X side.
    # ========================================================

    tag_0.xyz:
      [0.030, 3.050, 0.120]

    tag_0.rpy:
      [0.0, -1.57079632679, 3.14159265359]


    tag_1.xyz:
      [0.030, -3.050, 0.120]

    tag_1.rpy:
      [0.0, -1.57079632679, 3.14159265359]


    # ========================================================
    # SIDE B
    #
    # Tags 2 and 3 are visible from -X side.
    # ========================================================

    tag_2.xyz:
      [-0.030, 3.050, 0.120]

    tag_2.rpy:
      [0.0, -1.57079632679, 0.0]


    tag_3.xyz:
      [-0.030, -3.050, 0.120]

    tag_3.rpy:
      [0.0, -1.57079632679, 0.0]