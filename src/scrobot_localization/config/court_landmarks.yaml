tag_global_localizer:
  ros__parameters:
    # `map` is the badminton-court global coordinate frame used by Nav2.
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    camera_frame: camera_color_frame
    detections_topic: /apriltag/detections
    observed_tag_prefix: observed_tag_
    mount_frame_prefix: tag_mount_
    known_tag_prefix: court_tag_

    pole_x: 0.0
    left_pole_y: 3.05
    right_pole_y: -3.05
    tag_height: 0.150
    tag_mount_radius: 0.075
    inward_angle_deg: 45.0
    tag_edge_size: 0.100
    active_grid_cells: 6
    quiet_border_cells: 1
    texture_pixels: 1024

    # Smoothing retained by the global localizer.
    filter_tau: 0.25
    min_decision_margin: 20.0
    max_tag_distance: 10.0
    relocalization_max_distance: 10.0
    max_view_angle_deg: 35.0
    max_position_disagreement: 0.15
    max_yaw_disagreement_deg: 6.0
    default_sample_count: 15
    default_timeout: 5.0
    batch_outlier_position: 0.10
    batch_outlier_yaw_deg: 4.0
    max_batch_position_std: 0.04
    max_batch_yaw_std_deg: 1.5
    minimum_batch_keep_ratio: 0.70
    stationary_linear_threshold: 0.02
    stationary_angular_threshold: 0.03
    stationary_settle_time: 0.30
    processing_rate: 20.0
    publish_rate: 30.0

tag_approach_controller:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    detections_topic: /apriltag/detections
    observed_tag_prefix: observed_tag_
    cmd_vel_topic: /cmd_vel_relocalization

    min_decision_margin: 10.0
    max_detection_distance: 10.0
    default_target_distance: 0.90
    default_timeout: 60.0
    tag_lost_timeout: 1.0

    selection_settle_time: 0.18
    selection_window: 0.30
    selection_min_samples: 3
    pending_detection_max_age: 0.25

    # Search completion is based on measured accumulated yaw, not elapsed time.
    search_angular_velocity: 0.45
    search_rotation_rad: 6.283185307179586
    max_linear_velocity: 0.25
    max_angular_velocity: 0.60

    # Alternative SMC strategy parameters retained for regression tests.
    # The production desired pose is defined at base_link.
    smc_reference_speed: 0.50
    smc_lambda: 2.00
    smc_ks: 1.60
    smc_eta: 0.50
    smc_phi: 0.08
    smc_krho: 0.80
    heading_stop_deg: 70.0

    # Proven production controller. Debug launches may override this to
    # compare the SMC / biarc / normal-ray alternatives.
    control_strategy: main_branch

    # Original main-branch direct-goal controller.
    main_k_position: 0.80
    main_k_heading: 1.80
    main_k_final_yaw: 1.80
    main_drive_heading_limit_deg: 35.0

    # Tangent biarc path feeding the SMC.
    biarc_spacing: 0.08
    biarc_lookahead: 0.30
    biarc_d1_factor_min: 0.15
    biarc_d1_factor_max: 6.0
    biarc_d1_factor_samples: 81
    biarc_max_arc_sweep_deg: 175.0

    # Normal-ray baseline.
    ray_position_tolerance: 0.12
    ray_heading_tolerance_deg: 8.0
    ray_cross_speed: 0.30
    ray_heading_gain: 1.80

    position_tolerance: 0.05
    yaw_tolerance_deg: 5.0
    stable_time: 0.25
    goal_filter_alpha: 0.30
    control_rate: 25.0
