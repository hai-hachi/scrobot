ekf_filter_node:
  ros__parameters:

    # ==========================================
    # Filter
    # ==========================================

    frequency: 50.0

    sensor_timeout: 0.1

    two_d_mode: true

    publish_tf: true

    publish_acceleration: false

    print_diagnostics: true

    debug: false


    # ==========================================
    # Frames
    # ==========================================

    map_frame: map

    odom_frame: odom

    base_link_frame: base_footprint

    world_frame: odom


    # ==========================================
    # Wheel encoder odometry
    # ==========================================
    #
    # Use encoder-integrated x/y pose directly for translation instead of
    # re-integrating /diff_drive_controller/odom twist.linear.x in the EKF.
    # Evaluation showed the wheel pose is accurate while the reported vx is
    # biased/noisy enough to create significant EKF position drift.
    #
    # vy = 0 is retained as the non-holonomic differential-drive constraint.
    # Wheel yaw / yaw-rate are deliberately NOT fused here; heading is owned
    # by the IMU + magnetometer path below.

    odom0: /diff_drive_controller/odom

    odom0_config:
      [
        true,  true,  false,   # x, y, z
        false, false, false,   # roll, pitch, yaw

        false, true,  false,   # vx, vy, vz

        false, false, false,   # vroll, vpitch, vyaw

        false, false, false    # ax, ay, az
      ]

    odom0_queue_size: 10

    odom0_differential: false

    odom0_relative: false


    # ==========================================
    # IMU + magnetometer orientation
    # ==========================================

    imu0: /imu/data

    imu0_config:
      [
        false, false, false,   # x, y, z

        false, false, true,    # roll, pitch, yaw

        false, false, false,   # vx, vy, vz

        false, false, true,    # vroll, vpitch, vyaw

        false, false, false    # ax, ay, az
      ]

    imu0_queue_size: 20

    imu0_differential: false

    imu0_relative: true

    imu0_remove_gravitational_acceleration: false
