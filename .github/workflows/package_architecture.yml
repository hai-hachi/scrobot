name: SCROBOT Package Architecture Contracts

on:
  push:
    branches:
      - main
      - real-comparison
    paths:
      - "src/**"
      - "tools/**"
      - "docs/real_comparison/**"
      - ".github/workflows/package_architecture.yml"
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 3 architecture contracts
        run: python3 tools/test_package_architecture.py -v
      - name: Pure sweep geometry tests
        run: python3 -m unittest discover -s src/scrobot_mission/test -v
      - name: Dry-run full mission runner for both profiles
        run: |
          python3 tools/real_comparison/run_full_mission.py \
            --model /missing/example.pt --profile october_baseline --dry-run
          python3 tools/real_comparison/run_full_mission.py \
            --model /missing/example.pt --profile magnetometer_enabled --dry-run
      - name: Verify full mission acceptance criteria
        run: python3 -m unittest discover -s tools/real_comparison -p 'test_*.py' -v
      - name: Compile Python source and launch files
        run: python3 -m compileall -q src tools
