name: SCROBOT Gazebo Lighting Lab

on:
  push:
    branches:
      - real-comparison
    paths:
      - "tools/lighting_lab/**"
      - "src/scrobot_simulation/worlds/badminton_court.sdf"
      - "src/scrobot_simulation/config/lighting_lab.yaml"
      - "docs/real_comparison/lighting_lab.md"
      - ".github/workflows/lighting_lab.yml"
  workflow_dispatch:

jobs:
  offline-world-and-gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser for Lighting Lab config
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Compile Python 3 lighting lab
        run: python3 -m compileall -q tools/lighting_lab
      - name: Verify SDF generator, YAML persistence, HSV, geometry, and dashboard
        run: python3 -m unittest discover -s tools/lighting_lab -p "test_*.py" -v
      - name: Syntax-check embedded three-view dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          doc = Path("tools/lighting_lab/index.html").read_text()
          assert doc.count("<script>") == 1
          assert doc.count("</script>") == 1
          script = doc.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/scrobot_lighting_lab_ui.js").write_text(script)
          PY
          node --check /tmp/scrobot_lighting_lab_ui.js
      - name: Smoke-test dashboard control initialization and actions
        run: node tools/lighting_lab/test_dashboard_boot.js
      - name: Generate example lighting world and check complete camera layout
        run: |
          python3 - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sys.path.insert(0, "tools/lighting_lab")
          from scene import build_world, default_settings
          src = Path("src/scrobot_simulation/worlds/badminton_court.sdf")
          settings = default_settings()
          with tempfile.TemporaryDirectory() as temp:
              target = Path(temp) / "lighting_lab_world.sdf"
              target.write_text(build_world(src, settings))
              world = ET.parse(target).getroot().find("world")
              assert world.get("name") == "badminton_court"
              assert len(world.findall("light")) == 6
              camera_models = {
                  m.get("name") for m in world.findall("model")
                  if m.find("./link/sensor") is not None
              }
              assert camera_models == {
                  "lab_overhead_camera", "lab_free_camera"
              }
              assert world.find("./plugin[@filename='gz-sim-user-commands-system']") is not None
              print("Gazebo lighting lab derivative SDF: OK")
          PY
