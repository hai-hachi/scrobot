name: SCROBOT Gazebo Runtime Contracts

on:
  push:
    branches:
      - main
      - "perf/**"
    paths:
      - "src/scrobot_simulation/**"
      - "src/scrobot_debug/launch/full_mission_check.launch.py"
      - "src/scrobot_perception/**"
      - "src/scrobot_diagnostics/scripts/health_monitor.py"
      - "tools/test_sim_runtime_contract.py"
      - ".github/workflows/simulation_perf.yml"
  workflow_dispatch:

jobs:
  python3-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python3 syntax and runtime-profile contracts (no ROS required)
        run: |
          python3 tools/test_sim_runtime_contract.py -v
          python3 -m compileall -q \
            src/scrobot_simulation/launch \
            src/scrobot_debug/launch \
            src/scrobot_perception/launch \
            src/scrobot_diagnostics/scripts
