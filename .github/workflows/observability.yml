name: SCROBOT Observability Smoke Tests

on:
  pull_request:
    paths:
      - "src/scrobot_diagnostics/**"
      - "src/scrobot_mission/scrobot_mission/sweep_mission_manager.py"
      - "src/scrobot_debug/launch/full_mission_check.launch.py"
      - ".github/workflows/observability.yml"
  push:
    branches: [main]
    paths:
      - "src/scrobot_diagnostics/**"

jobs:
  offline-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check diagnostics and launch Python
        run: |
          python3 -m compileall -q src/scrobot_diagnostics
          python3 -m py_compile \
            src/scrobot_debug/launch/full_mission_check.launch.py \
            src/scrobot_mission/scrobot_mission/sweep_mission_manager.py
      - name: Health-rule fault injection tests (no ROS required)
        run: |
          python3 -m unittest discover \
            -s src/scrobot_diagnostics/test \
            -p "test_*.py" -v
