name: Nav2 Lab pure-Python checks
on:
  push:
    paths:
      - 'tools/nav2_lab/**'
      - 'src/scrobot_navigation/config/nav2_params.yaml'
      - '.github/workflows/nav2_lab.yml'
  pull_request:
    paths:
      - 'tools/nav2_lab/**'
      - 'src/scrobot_navigation/config/nav2_params.yaml'
      - '.github/workflows/nav2_lab.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - name: Compile Nav2 Lab Python sources
        run: python -m compileall -q tools/nav2_lab
      - name: Check browser JavaScript syntax
        run: node --check tools/nav2_lab/planning/web/app.js
      - name: Validate config and geometric metrics
        run: python -m pytest -q tools/nav2_lab/tests tools/nav2_lab/planning/tests
