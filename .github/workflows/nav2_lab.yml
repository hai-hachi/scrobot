name: Nav2 Lab pure-Python checks
on:
  push:
    paths:
      - 'tools/nav2_lab/**'
      - 'src/scrobot_tracker_controller/**'
      - 'tools/shared/lab_configs.py'
      - 'tools/shared/sim_speed.py'
      - 'src/scrobot_navigation/config/nav2_params.yaml'
      - '.github/workflows/nav2_lab.yml'
  pull_request:
    paths:
      - 'tools/nav2_lab/**'
      - 'src/scrobot_tracker_controller/**'
      - 'tools/shared/lab_configs.py'
      - 'tools/shared/sim_speed.py'
      - 'src/scrobot_navigation/config/nav2_params.yaml'
      - '.github/workflows/nav2_lab.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - name: Compile Nav2 Lab Python sources
        run: python -m compileall -q tools/nav2_lab
      - name: Check browser JavaScript syntax
        run: |
          node --check tools/nav2_lab/planning/web/app.js
          node --check tools/nav2_lab/tracking/web/app.js
          node --check tools/nav2_lab/tracking/web/chart_scales.js
          node --check tools/nav2_lab/tracking/web/timeline_geometry.js
          node --check tools/nav2_lab/tracking/web/math_formulas.js
          node --check tools/nav2_lab/shared/rtf_control.js
      - name: Test Tracker multi-run plot and timeline geometry
        run: |
          node --test tools/nav2_lab/tracking/tests/test_chart_scales.cjs
          node --test tools/nav2_lab/tracking/tests/test_timeline_geometry.cjs
          node --test tools/nav2_lab/tracking/tests/test_math_formulas.cjs
      - name: Validate config and geometric metrics
        run: python -m pytest -q tools/nav2_lab/tests tools/nav2_lab/planning/tests tools/nav2_lab/tracking/tests
