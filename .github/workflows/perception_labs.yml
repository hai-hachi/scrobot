name: SCROBOT Perception Labs v3

on:
  push:
    branches: [real-comparison]
    paths:
      - 'tools/perception_labs/**'
      - 'src/scrobot_simulation/config/camera_calibration.yaml'
      - 'src/scrobot_simulation/launch/simulation.launch.py'
      - 'src/scrobot_simulation/launch/spawn_robot.launch.py'
      - 'src/scrobot_simulation/urdf/scrobot_sim.urdf.xacro'
      - 'src/scrobot_simulation/urdf/sensors_gazebo.xacro'
      - 'src/scrobot_debug/launch/yolo_dataset_capture.launch.py'
      - 'src/scrobot_simulation/worlds/badminton_court.sdf'
      - '.github/workflows/perception_labs.yml'
  workflow_dispatch:

jobs:
  offline-perception-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser for simulation camera calibration tests
        run: python -m pip install PyYAML
      - name: Validate Python, startup shell, and browser JavaScript
        run: |
          python -m compileall -q tools/perception_labs src/scrobot_simulation/launch/simulation.launch.py src/scrobot_simulation/launch/spawn_robot.launch.py src/scrobot_debug/launch/yolo_dataset_capture.launch.py
          bash -n tools/perception_labs/start.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/perception_labs/index.html').read_text(encoding='utf-8')
          Path('/tmp/perception_lab_ui.js').write_text(p.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/perception_lab_ui.js
      - name: Validate Gazebo scene generation and perception lab contracts
        run: python -m unittest discover -s tools/perception_labs/tests -p 'test_*.py' -v
