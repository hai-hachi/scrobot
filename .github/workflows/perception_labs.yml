name: SCROBOT Perception Labs v2
on:
  push:
    branches: [real-comparison]
    paths:
      - 'tools/perception_labs/**'
      - 'src/scrobot_simulation/worlds/badminton_court.sdf'
      - 'src/scrobot_debug/worlds/yolo_dataset.sdf'
      - '.github/workflows/perception_labs.yml'
  workflow_dispatch:
jobs:
  smoke-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python and shell syntax
        run: |
          python3 -m compileall -q tools/perception_labs
          bash -n tools/perception_labs/start.sh
      - name: Verify isolated Gazebo world, camera, lighting, and browser
        run: |
          python3 -m unittest discover -s tools/perception_labs/tests -p 'test_*.py' -v
