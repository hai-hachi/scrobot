name: SCROBOT Mobility Lab

on:
  push:
    branches: [real-comparison]
    paths:
      - 'tools/mobility_lab/**'
      - 'src/scrobot_description/urdf/scrobot.urdf.xacro'
      - 'src/scrobot_description/urdf/wheels.xacro'
      - 'src/scrobot_simulation/urdf/scrobot_sim.urdf.xacro'
      - 'src/scrobot_simulation/urdf/physics_gazebo.xacro'
      - 'src/scrobot_simulation/launch/mobility_lab.launch.py'
      - 'src/scrobot_simulation/launch/simulation.launch.py'
      - 'src/scrobot_simulation/launch/spawn_robot.launch.py'
      - 'src/scrobot_simulation/config/mobility_calibration.yaml'
      - 'src/scrobot_simulation/scripts/sim_motor_response.py'
      - 'src/scrobot_simulation/CMakeLists.txt'
      - 'src/scrobot_simulation/package.xml'
      - 'src/scrobot_bringup/launch/sim.launch.py'
      - 'src/scrobot_bringup/package.xml'
      - 'src/scrobot_control/launch/control_stack.launch.py'
      - '.github/workflows/mobility_lab.yml'
  workflow_dispatch:

jobs:
  headless-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML for publication tests
        run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml
      - name: Syntax-check Python modules and ROS launch descriptions
        run: |
          python3 -m compileall -q tools/mobility_lab src/scrobot_simulation/scripts/sim_motor_response.py src/scrobot_bringup/launch/sim.launch.py src/scrobot_control/launch/control_stack.launch.py src/scrobot_simulation/launch/mobility_lab.launch.py src/scrobot_simulation/launch/spawn_robot.launch.py src/scrobot_simulation/launch/simulation.launch.py
      - name: Validate wheel Xacro XML and lab controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path in ('src/scrobot_description/urdf/scrobot.urdf.xacro',
                       'src/scrobot_description/urdf/wheels.xacro',
                       'src/scrobot_simulation/urdf/scrobot_sim.urdf.xacro',
                       'src/scrobot_simulation/urdf/physics_gazebo.xacro'):
              ET.parse(path)
          ui = Path('tools/mobility_lab/index.html').read_text()
          for name in ('drive_contact_mu', 'caster_contact_mu', 'wheel_joint_damping',
                       'wheel_collision_width', 'drive_slip1', 'drive_slip2',
                       'tau_left', 'tau_right', 'leftChart',
                       'rightChart', 'matlabFile', 'publish', 'publishStatus'):
              assert name in ui, name
          PY
      - name: Syntax-check embedded browser JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tools/mobility_lab/index.html').read_text()
          assert text.count('<script>') == 1 and text.count('</script>') == 1
          Path('/tmp/mobility-lab-browser.js').write_text(
              text.split('<script>', 1)[1].split('</script>', 1)[0]
          )
          PY
          node --check /tmp/mobility-lab-browser.js
      - name: Run headless system-identification tests
        run: python3 -m unittest discover -s tools/mobility_lab/tests -p 'test_*.py' -v
